{% extends "base.html" %}

{% block title %}Add Student - MBHB Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Add New Student</h1>
</div>

<div class="row">
    <div class="col-md-6">
        <form method="POST">
            <div class="mb-3">
                <label for="student_id" class="form-label">Student ID *</label>
                <input type="text" class="form-control" id="student_id" name="student_id" required>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="mb-3">
                <label for="grade_level" class="form-label">Grade Level</label>
                <input type="text" class="form-control" id="grade_level" name="grade_level" 
                       placeholder="e.g., IB HL Year 2">
            </div>
            <div class="mb-3">
                <label for="exam_date" class="form-label">Exam Date</label>
                <input type="date" class="form-control" id="exam_date" name="exam_date">
            </div>
            <button type="submit" class="btn btn-primary">Add Student</button>
            <a href="{{ url_for('students.list_students') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
